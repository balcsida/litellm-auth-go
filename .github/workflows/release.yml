name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag signature
        shell: bash
        run: |
          printf '%s\n' 'balcsida@gmail.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIcbnKfDVPJ9+k6+rwbQea3wYoxe5g6hNgTXXmYPLOKd' > "$RUNNER_TEMP/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test ./...
      - name: Build release binaries
        shell: bash
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            output=dist/litellm-auth-$os-$arch
            if [ "$os" = windows ]; then
              output=$output.exe
            fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "$output" ./cmd/litellm-auth
          done
          cd dist
          sha256sum litellm-auth-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
