name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: go vet ./...
      - name: Run staticcheck
        env:
          # Go 1.27.2 writes export data version 5, which staticcheck v0.8.1
          # cannot read; analyse with the newest toolchain it supports.
          GOTOOLCHAIN: go1.27.1
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  package:
    name: Package
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Build release binaries
        shell: bash
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            output=dist/litellm-auth-$os-$arch
            if [ "$os" = windows ]; then
              output=$output.exe
            fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "$output" ./cmd/litellm-auth
          done
          cd dist
          sha256sum litellm-auth-* > checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: litellm-auth
          path: dist/
          if-no-files-found: error

  smoke:
    name: LiteLLM full login smoke
    runs-on: ubuntu-latest
    env:
      # Only the presence flag is job-wide; the secret itself reaches the
      # proxy start step alone.
      LITELLM_LICENSE_PRESENT: ${{ secrets.LITELLM_LICENSE != '' }}
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: litellm
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d litellm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:5.0.2@sha256:f625692f5bf84939f3d0af4931f2c0f038dca84c4f1bac1171710d544181f97f
        env:
          JSON_CONFIG: >-
            {"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"code","match":".*","claims":{"sub":"smoke-user","email":"smoke@example.com","name":"Smoke User"}}]}]}
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install LiteLLM
        run: |
          # LiteLLM v1.99.0
          python -m pip install \
            "litellm[proxy] @ git+https://github.com/BerriAI/litellm.git@fa647f742d7baefe8eb1181899d9c81b41559772" \
            "prisma==0.11.0"
          prisma generate --schema "$(python -c 'import pathlib, litellm; print(pathlib.Path(litellm.__file__).parent / "proxy/schema.prisma")')"
      - name: Start LiteLLM
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/litellm
          GENERIC_AUTHORIZATION_ENDPOINT: http://127.0.0.1:8080/default/authorize
          GENERIC_CLIENT_ID: smoke-client
          GENERIC_CLIENT_SECRET: smoke-secret
          GENERIC_SCOPE: openid email profile
          GENERIC_TOKEN_ENDPOINT: http://127.0.0.1:8080/default/token
          GENERIC_USERINFO_ENDPOINT: http://127.0.0.1:8080/default/userinfo
          LITELLM_MASTER_KEY: sk-smoke-master-key
          LITELLM_SALT_KEY: smoke-salt-key-with-at-least-32-bytes
          PROXY_BASE_URL: http://127.0.0.1:4000
          LITELLM_LICENSE: ${{ secrets.LITELLM_LICENSE }}
        run: |
          if [ -n "${LITELLM_LICENSE:-}" ]; then
            cat > "$RUNNER_TEMP/litellm.yaml" <<'EOF'
          general_settings:
            enable_jwt_auth: true
            litellm_jwtauth:
              user_id_jwt_field: sub
              virtual_key_claim_field: sub
              unregistered_jwt_client_behavior: auto_register
              issuers:
                - issuer: http://127.0.0.1:19090
                  jwks_url: http://127.0.0.1:19090/jwks
                  audience: litellm-auth-smoke
          EOF
          else
            echo '{}' > "$RUNNER_TEMP/litellm.yaml"
          fi
          litellm --config "$RUNNER_TEMP/litellm.yaml" --host 127.0.0.1 --port 4000 > "$RUNNER_TEMP/litellm.log" 2>&1 &
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4000/health/readiness >/dev/null; then
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $LITELLM_MASTER_KEY" \
                --header "Content-Type: application/json" \
                --data '{"user_id":"smoke-user","user_email":"smoke@example.com","user_role":"internal_user"}' \
                http://127.0.0.1:4000/user/new >/dev/null
              if [ -n "${LITELLM_LICENSE:-}" ]; then
                curl --fail --silent --show-error \
                  --request POST \
                  --header "Authorization: Bearer $LITELLM_MASTER_KEY" \
                  --header "Content-Type: application/json" \
                  --data '{"user_id":"native-oidc-smoke-user","user_email":"native-oidc-smoke@example.com","user_role":"internal_user"}' \
                  http://127.0.0.1:4000/user/new >/dev/null
              fi
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/litellm.log"
          exit 1
      - name: Run full login smoke
        env:
          LITELLM_SMOKE_URL: http://127.0.0.1:4000
        run: go test -run '^TestLiteLLMFullLoginSmoke$' -count=1 .
      - name: Run OIDC JWT mapping smoke
        if: env.LITELLM_LICENSE_PRESENT == 'true'
        env:
          LITELLM_SMOKE_URL: http://127.0.0.1:4000
          LITELLM_OIDC_SMOKE_ISSUER: http://127.0.0.1:19090
        run: go test -run '^TestLiteLLMOIDCSmoke$' -count=1 .
      - if: failure()
        name: Show LiteLLM log
        run: cat "$RUNNER_TEMP/litellm.log"
